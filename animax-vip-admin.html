<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AniMax VIP — админка</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10121b;color:#f5f2ff}*{box-sizing:border-box}body{max-width:1050px;margin:auto;padding:24px}.head,form{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.card{background:#1b1f2d;border:1px solid #30364c;border-radius:18px;padding:20px;margin:18px 0}h1{margin:0;font-size:27px}.gold{color:#ffd54a;text-shadow:0 0 16px #ffce52}h2{margin-top:0;font-size:20px}input,button{font:inherit;border-radius:10px;padding:11px 13px;border:1px solid #424a68;background:#111522;color:inherit}input{min-width:150px;flex:1}button{cursor:pointer;border:0;font-weight:700;background:linear-gradient(135deg,#2b88ca,#be2edd)}button.secondary{background:#30384d}button.danger{background:#a9354c}.hidden{display:none}.message{min-height:22px;color:#ffd978}.error{color:#ff9faa}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #30364c;vertical-align:middle}th{color:#bfc8e3}code{font-size:12px;color:#9ed7ff}.active{color:#88edb2}.expired{color:#ff9faa}.shared{border-color:#ffd54a !important}input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}@media(max-width:650px){body{padding:14px}table{font-size:12px}th:nth-child(3),td:nth-child(3){display:none}}
</style></head><body>
<div class="head"><h1>AniMax <span class="gold">VIP</span> — админка</h1><button id="logout" class="secondary hidden">Выйти</button></div>
<section id="login" class="card"><h2>Вход администратора</h2><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль администратора" required><button>Войти</button></form><p id="loginMessage" class="message"></p></section>
<main id="panel" class="hidden">
<section class="card"><h2>Выдать VIP-код</h2><form id="createForm"><input id="label" placeholder="Кому / примечание" required><input id="code" placeholder="Свой код (необязательно)"><input id="days" type="number" min="1" max="366" value="30" required><button>Создать код</button></form><p id="created" class="message"></p></section>
<section class="card shared"><h2>Общий VIP-код</h2><form id="createSharedForm"><input id="sharedLabel" placeholder="Кому / примечание" required><input id="sharedCode" placeholder="Свой код (необязательно)"><input id="sharedDays" type="number" min="1" max="366" value="30" required><input id="sharedMaxUses" type="number" min="2" max="100000" value="10" required><button>Создать общий код</button></form><p id="sharedCreated" class="message"></p></section>
<section class="card"><div class="head"><h2>VIP-доступы</h2><button id="refresh" class="secondary">Обновить</button></div><input id="search" placeholder="Поиск по примечанию или ID"><p id="message" class="message"></p><table><thead><tr><th>Примечание</th><th>Срок до</th><th>Устройство</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>
</main>
<script>
let password='',items=[];const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async body=>{const r=await fetch(location.href,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+password},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d};
const show=(m,bad=false)=>{$('message').textContent=m;$('message').className=bad?'message error':'message'};
function render(){const q=$('search').value.toLowerCase();const visible=items.filter(x=>(x.label+' '+x.deviceId).toLowerCase().includes(q));$('rows').innerHTML=visible.map(x=>'<tr><td>'+esc(x.label||'Без названия')+'</td><td class="'+(x.active?'active':'expired')+'">'+new Date(x.expiresAt).toLocaleString('ru-RU')+'</td><td><code>'+x.deviceId+'</code></td><td><button class="danger" data-id="'+x.deviceId+'">Отозвать</button></td></tr>').join('')||'<tr><td colspan="4">Ничего не найдено</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Отозвать VIP у этого устройства?'))return;try{await api({action:'revoke',deviceId:b.dataset.id});await load()}catch(e){show(e.message,true)}})}
async function load(){const d=await api({action:'list'});items=d.items;render();show('')}
$('loginForm').onsubmit=async e=>{e.preventDefault();password=$('password').value;try{await load();$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden')}catch(e){$('loginMessage').textContent=e.message;$('loginMessage').className='message error'}};
$('logout').onclick=()=>{password='';$('panel').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');$('password').value=''};$('refresh').onclick=load;$('search').oninput=render;
$('createForm').onsubmit=async e=>{e.preventDefault();try{const d=await api({action:'create',label:$('label').value,code:$('code').value,days:+$('days').value});$('created').textContent='Код создан: '+d.code+' — сохраните его сейчас, повторно он не показывается.';$('code').value='';$('label').value='';await load()}catch(e){$('created').textContent=e.message;$('created').className='message error'}};
$('createSharedForm').onsubmit=async e=>{e.preventDefault();try{const d=await api({action:'create_shared',label:$('sharedLabel').value,code:$('sharedCode').value,days:+$('sharedDays').value,maxUses:+$('sharedMaxUses').value});$('sharedCreated').textContent='Общий код создан: '+d.code+' (использований: '+d.maxUses+') — сохраните его сейчас.';$('sharedCode').value='';$('sharedLabel').value='';$('sharedMaxUses').value='10';await load()}catch(e){$('sharedCreated').textContent=e.message;$('sharedCreated').className='message error'}};
</script></body></html>
